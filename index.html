<head>
<meta charset="utf-8">

<style>
/* Layout: phone-first single column, bottom tab bar, bottom sheets. Motif: 洗濯タグ-style location codes in mono, floor plan of 303. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#e8eaf1; --line:#d5d9e4;
  --fg:#1c2233; --muted:#6a7185; --accent:#2f4a8a; --accent-soft:#dfe6f6; --on-accent:#ffffff;
  --tag:#b5563d; --warn:#b07a12; --ok:#2f7a55; --wet:#e3eef5; --wet-line:#9fbfd3;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --surface:#1b2030; --surface-2:#252b3d; --line:#343b52;
  --fg:#e7e9f1; --muted:#9aa1b5; --accent:#8fa9e8; --accent-soft:#263456; --on-accent:#10152a;
  --tag:#e08a70; --warn:#e0b24f; --ok:#6cc39a; --wet:#1d2b36; --wet-line:#3d5a6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --surface:#1b2030; --surface-2:#252b3d; --line:#343b52;
  --fg:#e7e9f1; --muted:#9aa1b5; --accent:#8fa9e8; --accent-soft:#263456; --on-accent:#10152a;
  --tag:#e08a70; --warn:#e0b24f; --ok:#6cc39a; --wet:#1d2b36; --wet-line:#3d5a6d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
h1 .num{font-family:var(--f-code);font-weight:600;color:var(--accent)}
h2{font-size:16px;margin:0;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.panel,.sheet,.empty,.notice{overflow-wrap:anywhere}
.panel>*,.sheet>*{min-width:0}
.row.between>*{min-width:0}
.row.between>.btn,.row.between>button{flex:none}
.sub{color:var(--muted);font-size:13px}
.sub a{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--f-code);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--tag);border:1.5px solid currentColor;border-radius:4px;padding:0 5px;line-height:18px;display:inline-block;white-space:nowrap}
.ro-pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--tag);border-color:var(--tag)}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ci{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:hsl(var(--h) 75% 91%);color:hsl(var(--h) 48% 40%);flex:none;vertical-align:middle}
.ci svg{width:72%;height:72%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ci .f{fill:currentColor;fill-opacity:.22}.ci .s{fill:currentColor;stroke:none}
.ci.lg{width:40px;height:40px}.ci.xl{width:60px;height:60px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ci{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 65% 80%)}}
:root[data-theme="dark"] .ci{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 65% 80%)}
.chip .ci{width:20px;height:20px;margin:-3px 4px -1px -6px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px}
.chip.cat{border:1.5px solid transparent;background:none;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.25;color:var(--fg);text-align:center;overflow-wrap:anywhere}
.chip.cat .ci{margin:0;width:40px;height:40px}
.chip.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.hops{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.hop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);min-width:0}
.hop img{width:34px;height:34px;border-radius:9px;flex:none}
.hop b{font-size:14px;display:block;line-height:1.3}
.hop span span{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.strip .card{flex:0 0 108px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column;min-width:0;position:relative}
.card .ph{aspect-ratio:3/4;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:5px 7px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.sel .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px;color:var(--fg)}
.search.big{border:2px solid var(--accent)}
select,input[type=text],input[type=number],input[type=email],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:flex;max-width:760px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(20,30,60,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-inline:16px;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.photo-pick{position:relative;aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;padding:0;width:100%}
.photo-pick img{width:100%;height:100%;object-fit:contain}
.photo-pick .chg{position:absolute;right:8px;bottom:8px;background:rgba(10,14,25,.6);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.big-photo{width:100%;max-height:52vh;object-fit:contain;border-radius:var(--r);background:var(--surface-2);aspect-ratio:4/3}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.map-wrap svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.zone:hover rect,.zone:focus rect{fill:var(--accent)}
.zone:hover text,.zone:focus text{fill:var(--on-accent)}
.zone text{fill:var(--fg);font-size:16px;font-family:var(--f-body)}
.zone.off rect{fill:var(--surface-2);stroke:var(--line)}
.zone .n{font-family:var(--f-code);font-weight:600;fill:var(--accent);font-size:13px}
.wall{fill:none;stroke:var(--fg);stroke-width:4}
.wall-thin{stroke:var(--fg);stroke-width:2.5}
.room-lbl{fill:var(--muted);font-size:14px;font-family:var(--f-body)}
.fixed{fill:var(--surface-2);stroke:var(--line)}
.wetbg{fill:var(--wet);stroke:none}
.loc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.loc-row .grow{flex:1;min-width:0}
.loc-row .grow b{display:block;font-size:14px}
.btn.sm{padding:4px 10px;font-size:13px}
.wx-main{display:flex;align-items:center;gap:14px}.wx-now{font-size:44px;font-weight:700;line-height:1}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.outfit{width:100%;text-align:left;gap:8px;font:inherit;color:inherit;margin-bottom:8px}
.of-thumbs{display:flex;gap:6px;flex-wrap:wrap}.of-thumbs img,.of-ph{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center}
.feel{font-weight:600}.feel.f-2,.feel.f-1{color:hsl(210 60% 45%)}.feel.f0{color:var(--ok)}.feel.f1,.feel.f2{color:var(--tag)}
.sim{display:flex;align-items:center;gap:10px;margin-top:8px}
.sim img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.sim .grow{flex:1;min-width:0}.sim .grow b,.sim .grow .sub{display:block;overflow-wrap:anywhere}
.loc-row select{margin-top:4px;padding:4px 8px}
.loc-row>.btn{padding:6px 11px;flex:none}
.loc-row .grow span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.fill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.fill.f1{background:var(--accent-soft);color:var(--accent)}
.fill.f2{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.fill.f3{color:var(--tag);background:color-mix(in srgb,var(--tag) 15%,transparent)}
.bar-row{display:grid;grid-template-columns:5.5em 1fr 3em;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.big-num{font-family:var(--f-code);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.review-card{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.review-card img,.review-card .noimg{width:100%;max-height:48vh;object-fit:contain;border-radius:var(--r);background:var(--surface-2)}
.review-card .noimg{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted)}
.rv-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rv-btns button{padding:14px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.rv-btns .w{color:var(--ok)}.rv-btns .n{color:var(--warn)}.rv-btns .d{color:var(--tag)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.label{background:#fff;color:#1c2233;border:1.5px solid #1c2233;border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.label .lc{font-family:var(--f-code);font-weight:600;font-size:26px;letter-spacing:.06em}
.label .ln{font-size:12px}
.label .qr img,.label .qr canvas{width:86px;height:86px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:var(--r);padding:12px;font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hit{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.hit .grow{flex:1;min-width:0}
.hit .grow b{display:block;font-size:14px}
.hit .snip{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%;overflow-x:hidden}
/* iPhone 上输入框的字小于 16px 时，点进去 Safari 会自动放大整页，画面就超出去了 */
select,input[type],textarea{font-size:16px}
input[type=date]{min-width:0;max-width:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.logo{width:44px;height:44px;border-radius:10px;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.login{max-width:360px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.login img{width:120px;height:120px;margin:0 auto;border-radius:26px}
.login input{font-size:16px}
</style>
</head>
<body>

<main id="app">
  <div class="stack">
    <div><h1>衣帽间</h1><div class="sub">正在读取衣服和鞋…</div></div>
    <div class="empty">衣服和鞋放在哪个箱子、哪个挂衣区，都会整理在这里。</div>
  </div>
</main>

<button class="fab" id="fab" type="button" hidden>＋ 录入</button>
<nav class="tabs" aria-label="主菜单"><div id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
const APP_URL = "https://xinyue119-code.github.io/dongyang303/";
// 衣服和鞋以外的东西（清单、存货、文具…）都在杂物间那个 app 里
const ZAWU_URL = "https://xinyue119-code.github.io/dongyang303-zawu/";
const CATS = [
  ["T恤/背心",1.2],["衬衫",1.5],["针织/毛衣",3],["卫衣",3.5],["外套",5],["大衣/羽绒",10],
  ["裤子",2],["裙子",1.5],["连衣裙",2],["正装/套装",3],["运动服",1.5],["睡衣",2],["保暖内衣",1],["围巾",1],["帽子",1],["袜子",0.3],["鞋",0],["床品",18],["其他",2],["回到c酱身边",2]
];
// 这些类别录入时可以不选季节（不选就当四季都有）
const NO_SEASON = ["鞋","回到c酱身边"];
const CAT_VOL = Object.fromEntries(CATS);
const SEASONS = ["春","夏","秋","冬"];
const COLORS = ["黑","白","灰","米/卡其","棕","蓝","绿","红/粉","黄","紫","花色"];
const FILLS = ["空","一半","快满","满"];
const SPOTS = {
  toilet:"卫生间", shelf:"收纳架", basin:"洗手台下", washer:"洗衣机旁", genkan:"玄关", kitchen:"厨房", cl:"衣柜 CL",
  boxes:"进门收纳箱", kotatsu:"こたつ上", shelf3:"三层架", desktop:"桌上小盒", cabinet:"四层柜", rack:"挂衣架",
  bedin:"床下（另一张）", bedwin:"床下（靠窗）", longbox:"床边长箱", water:"水", bedside:"床头柜", smalltable:"小桌下", desk:"书桌下", pajama:"睡衣筐", unplaced:"还没定位置"
};
const BOX_L = 47;

const S = { items:[], locs:[], tab:"home", q:"", gq:"", fCat:"", fSeason:"", fLoc:"", loaded:{i:false,l:false},
  sortSel:new Set(), locSel:new Set(), locSelFor:null, spotEdit:null, sortTarget:"", rvSeason:null, db:null, dl:null, ro:false, photoCache:{},
  sticky:{cat:"",seasons:null,loc:""} };

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const r=$("#toast-root");r.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2400)}

function curSeason(d=new Date()){const m=d.getMonth()+1;return m>=3&&m<=5?"春":m>=6&&m<=8?"夏":m>=9&&m<=11?"秋":"冬"}
function seasonStart(d=new Date()){const y=d.getFullYear(),m=d.getMonth()+1;
  if(m>=3&&m<=5)return new Date(y,2,1);if(m>=6&&m<=8)return new Date(y,5,1);if(m>=9&&m<=11)return new Date(y,8,1);
  return m===12?new Date(y,11,1):new Date(y-1,11,1)}
function reviewKey(season){const d=new Date(),m=d.getMonth()+1;let y=d.getFullYear();
  if(season==="冬"&&m<=5)y-=1;
  if(season!=="冬"&&curSeason()!=="冬"&&SEASONS.indexOf(season)>SEASONS.indexOf(curSeason()))y-=1;
  return y+season}
function defaultReviewSeason(){const m=new Date().getMonth()+1;const cur=curSeason();
  const first={春:3,夏:6,秋:9,冬:12}[cur];const prev=SEASONS[(SEASONS.indexOf(cur)+3)%4];
  return (m===first||m===first%12+1)?prev:cur}

const hopsHTML = me => `<nav class="hops" aria-label="其他整理 app">${APPS.filter(a=>a[0]!==me).map(([,n,sub,u])=>`<a class="hop" href="${u}"><img src="${u}icon-192.png" alt=""><span><b>${n}</b><span>${sub}</span></span></a>`).join("")}</nav>`;
const catIcon = (c,size="") => {const d=(window.CAT_ICONS||{})[c];return d?`<span class="ci ${size}" style="--h:${d[0]}" aria-hidden="true"><svg viewBox="0 0 24 24">${d[1]}</svg></span>`:""};

const itemLocs = () => S.locs.filter(l=>hasMode(l,"item"));

const thumbSrc = i => i.thumb || "";
const itemTitle = i => i.note ? i.note : ((i.brand?i.brand+" ":"")+(i.colors&&i.colors[0]?i.colors[0]:"")+i.cat);
// 品牌：不分大小写算同一个，用得最多的写法当标准写法，按使用次数排
function brandStats(){const m=new Map();
  for(const i of S.items){const b=(i.brand||"").trim();if(!b)continue;const k=b.toLowerCase();const e=m.get(k)||{n:0,forms:{}};e.n++;e.forms[b]=(e.forms[b]||0)+1;m.set(k,e)}
  return [...m.values()].map(e=>({name:Object.entries(e.forms).sort((a,b)=>b[1]-a[1])[0][0],n:e.n})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name))}
const brandsUsed = () => brandStats().map(x=>x.name);
const normBrand = b => {b=(b||"").trim().replace(/\s+/g," ");if(!b)return "";const hit=brandsUsed().find(x=>x.toLowerCase()===b.toLowerCase());return hit||b};
const brandChips = cur => {const bs=brandsUsed().slice(0,16);return bs.length?`<div class="chips">${bs.map(b=>`<button class="chip" type="button" data-act="brand-pick" data-v="${esc(b)}" aria-pressed="${(cur||"").toLowerCase()===b.toLowerCase()}">${esc(b)}</button>`).join("")}</div>`:""};
// 重复：备注（名称）一样、品牌也一样（或有一边没填品牌）的算同一件
const normName = s => (s||"").trim().replace(/\s+/g," ").toLowerCase();
function sameThing(a,b){
  const n=normName(a.note);
  if(n) return n===normName(b.note)&&(!a.brand||!b.brand||a.brand.toLowerCase()===b.brand.toLowerCase());
  // 没写名称：类别、品牌、颜色都填了而且都一样，也算很像
  const ca=[...(a.colors||[])].sort().join(),cb=[...(b.colors||[])].sort().join();
  return !normName(b.note)&&!!a.brand&&!!b.brand&&a.brand.toLowerCase()===b.brand.toLowerCase()&&a.cat===b.cat&&!!ca&&ca===cb;
}
function dupGroups(){const left=activeItems().filter(i=>normName(i.note)),gs=[];
  while(left.length){const a=left.shift();const g=[a,...left.filter(b=>sameThing(a,b))];if(g.length>1){gs.push(g);g.slice(1).forEach(b=>left.splice(left.indexOf(b),1))}}
  return gs}

function hl(text,q){const t=esc(text);if(!q)return t;const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(qe,"gi"),m=>`<mark>${m}</mark>`)}
function searchHTML(q){
  const ql=q.toLowerCase();
  const locHits=itemLocs().filter(l=>[l.name,l.code,l.note].join("\n").toLowerCase().includes(ql));
  const itemHits=activeItems().filter(i=>[i.note,i.brand,i.cat,(i.colors||[]).join(" "),locName(i.loc)].join(" ").toLowerCase().includes(ql));
  const n=locHits.length+itemHits.length;
  let h=`<section><div class="sub">找到 ${n} 处</div>`;

  const hardLoc=i=>{const l=locById(i.loc);return !!l&&!l.out&&(["cl","bedin","bedwin"].includes(l.spot)||l.kind==="suitcase")};
  const out=clothes.filter(i=>(i.seasons||[]).includes(cs)&&i.loc&&locById(i.loc)&&!hardLoc(i));

  </section>`;
  return {top,body:h};

function wxPlace(){try{return JSON.parse(localStorage.getItem("wxPlace")||"null")}catch(_){return null}}

async function loadWeather(force){

  S.wxLoading=true;
  try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
    const j=await (await fetch(u)).json();const d=j.daily;
    S.wx={key:pl.lat+","+pl.lon,at:Date.now(),now:Math.round(j.current.temperature_2m),feel:Math.round(j.current.apparent_temperature),
      code:d.weather_code[0],tmax:Math.round(d.temperature_2m_max[0]),tmin:Math.round(d.temperature_2m_min[0]),
      amax:Math.round(d.apparent_temperature_max[0]),amin:Math.round(d.apparent_temperature_min[0]),rain:d.precipitation_probability_max[0]??0};S.wxErr=""}

async function searchCity(q){const box=$("#city-res");if(!q||!box)return;box.innerHTML='<div class="sub">搜索中…</div>';

// 一天可以有好几套（2026-11-10 起）：每套一条，按日期新的在前，同一天按先记的在前
const myOutfits=()=>(S.outfits||[]).filter(o=>o.by===(S.user?.email||"").toLowerCase()).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.created||a.updated||0)-(b.created||b.updated||0));

    ${todays.length?todays.map(o=>outfitLine(o,true)).join("")+`<div class="sub">点一套可以修改，晚上回来补感觉也行。</div>`:`<div class="empty">出门前选一下今天穿的衣服；换了一身（比如上班一套、运动一套）就再记一套。</div>`}</section>`;

  else{const i=todo[0];const src=thumbSrc(i);
    h+=`<div class="panel review-card"><div class="row between"><span class="sub">${key.slice(0,4)}年${S.rvSeason}季 · 第 ${done+1} / ${pool.length} 件</span><button class="btn" type="button" data-act="rv-skip" data-id="${esc(i.id)}">先跳过</button></div>
      ${src?`<img src="${src}" alt="" data-full="${esc(i.id)}">`:`<div class="noimg">无照片</div>`}
      <div><b>${esc(itemTitle(i))}</b><div class="sub">${esc(i.cat)} · 在 ${esc(locName(i.loc))}</div></div>
      <div class="rv-btns"><button class="w" type="button" data-rvset="worn" data-id="${esc(i.id)}">穿过</button><button class="n" type="button" data-rvset="not" data-id="${esc(i.id)}">没穿</button><button class="d" type="button" data-rvset="drop" data-id="${esc(i.id)}">不想要了</button></div></div>`}
  h+=`<section><div class="row between"><h2>考虑处理</h2><span class="sub">${cand.length} 件</span></div><div class="sub">标过「不想要了」，或者有两季都没穿的</div>

  return h;

async function toJpeg(file,max,qs){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let out="";for(const q of qs){out=c.toDataURL("image/jpeg",q);if(out.length<190000)break}
    return out;
  }finally{URL.revokeObjectURL(url)}
}
// 照片查重：每张图缩成 17×16 灰度算「差值指纹」（256 位，看形状）；再看颜色：4×4 的大致配色（按整体亮度拉平，
// 换个光线也能对上），以及衣服本身的色调（四边当背景，和背景差得多的格子算衣服）。三样都接近才算像。
// 已有衣服的指纹从 thumb 现算，算过的记在内存里
const SIGS=new Map();
async function imgSig(src){
  const im=await new Promise((res,rej)=>{const x=new Image();x.onload=()=>res(x);x.onerror=rej;x.src=src});
  const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  c.width=17;c.height=16;x.drawImage(im,0,0,17,16);const p=x.getImageData(0,0,17,16).data,g=[];
  for(let i=0;i<272;i++)g.push(p[i*4]*.3+p[i*4+1]*.59+p[i*4+2]*.11);
  const bits=[];for(let r=0;r<16;r++)for(let k=0;k<16;k++)bits.push(g[r*17+k]<g[r*17+k+1]?1:0);
  const px=i=>[p[i*4],p[i*4+1],p[i*4+2]],bg=[0,0,0];let nb=0;
  for(let r=0;r<16;r++)for(let k=0;k<17;k++)if(!r||r===15||!k||k===16){px(r*17+k).forEach((v,j)=>bg[j]+=v);nb++}
  bg.forEach((_,j)=>bg[j]/=nb);
  let sub=[0,0,0],ns=0;for(let i=0;i<272;i++){const v=px(i);if(Math.abs(v[0]-bg[0])+Math.abs(v[1]-bg[1])+Math.abs(v[2]-bg[2])>60){v.forEach((y,j)=>sub[j]+=y);ns++}}
  if(ns<8){sub=[0,0,0];for(let i=0;i<272;i++)px(i).forEach((y,j)=>sub[j]+=y)}
  const t=sub[0]+sub[1]+sub[2]||1,hue=sub.map(v=>v/t);
  c.width=4;c.height=4;x.drawImage(im,0,0,4,4);const q=x.getImageData(0,0,4,4).data,col=[];
  for(let i=0;i<16;i++)col.push(q[i*4],q[i*4+1],q[i*4+2]);
  const m=col.reduce((a,b)=>a+b,0)/48||1;
  return {bits,hue,norm:col.map(v=>v/m*128)}}
async function itemSig(i){const k=i.thumb.length,c=SIGS.get(i.id);if(c&&c.k===k)return c.sig;
  try{const sig=await imgSig(i.thumb);SIGS.set(i.id,{k,sig});return sig}catch(_){return null}}
function sigDist(a,b){let h=0;for(let i=0;i<256;i++)h+=a.bits[i]!==b.bits[i];
  let n=0;for(let i=0;i<48;i++)n+=Math.abs(a.norm[i]-b.norm[i]);
  const u=Math.abs(a.hue[0]-b.hue[0])+Math.abs(a.hue[1]-b.hue[1])+Math.abs(a.hue[2]-b.hue[2]);return {h,n:n/48,u}}
async function findSimilar(src){
  const me=await imgSig(src),out=[];
  for(const i of activeItems()){if(!i.thumb||i.id===draft?.id)continue;const sg=await itemSig(i);if(!sg)continue;
    const d=sigDist(me,sg);if(d.h<=40&&d.n<=10&&d.u<=.12)out.push({i,score:d.h/256+d.n/40+d.u})}
  return out.sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.i)}
async function simCheck(){const d=draft,f=d&&d._file;if(!f||d.id)return;d._sim=null;d._simOk=false;d._simPick="";
  let list=[];try{list=await findSimilar(d._preview)}catch(_){}
  if(draft!==d||d._file!==f)return;d._sim=list;const z=$("#sim-zone");if(z)z.innerHTML=simHTML()}
function simHTML(){const d=draft;if(!d||d.id||d._simOk||d._simPick||!d._sim||!d._sim.length)return "";

function findDup(d){return d.id?null:activeItems().find(i=>sameThing(d,i)||sameThing(i,d))||null}
function checkDup(atSave){
  const z=$("#dup-zone");if(!z||!draft||draft.id)return null;
  const d={...draft,note:$("#fm-note").value,brand:$("#fm-brand").value,loc:$("#fm-loc").value};
  const hit=(draft._simPick&&S.items.find(x=>x.id===draft._simPick))||findDup(d);draft._dupId=hit?hit.id:"";
  if(!hit||draft._dupOk){z.innerHTML="";return null}
  const to=d.loc&&locById(d.loc), here=hit.loc&&hit.loc===d.loc;
  z.innerHTML=`<div class="notice"><b>已存在相似衣物【${esc(itemTitle(hit))}】</b>（位于：${esc(locName(hit.loc))}）。${atSave?"先确认一下再保存：":""}
    <div class="row" style="margin-top:8px">${to&&!here?`<button class="btn primary" type="button" data-act="dup-move">直接移动到「${esc(to.name)}」</button>`:here?`<span class="sub">它已经在这个位置了。</span>`:""}${to&&!here?"":`<button class="btn primary" type="button" data-act="close">那就不录了</button>`}
    <button class="btn" type="button" data-act="dup-open">看看那件</button><button class="btn" type="button" data-act="dup-ignore">不是同一件，照样新增</button></div></div>`;
  if(atSave){$("#fm-msg").textContent="";z.scrollIntoView({block:"center",behavior:"smooth"})}
  return hit}
async function saveDraft(next){
  const d=draft, msg=$("#fm-msg");
  d.note=$("#fm-note").value.trim(); d.brand=normBrand($("#fm-brand").value); d.loc=$("#fm-loc").value;
  if(!d.cat){msg.textContent="请先选一个类别";return}
  if(!d.id&&!d._dupOk&&checkDup(true))return;
  if(!d.seasons.length&&!NO_SEASON.includes(d.cat)){msg.textContent="请至少选一个季节";return}
  msg.textContent="保存中…";
  document.querySelectorAll('[data-act="save"],[data-act="save-next"]').forEach(b=>b.disabled=true);
  try{
    let thumb=d.thumb||"", full=null;
    if(d._file){thumb=await toJpeg(d._file,260,[.72,.6]);full=await toJpeg(d._file,900,[.75,.62,.5,.4]);}
    const seasons=NO_SEASON.includes(d.cat)&&!d.seasons.length?[...SEASONS]:d.seasons;
    const body={cat:d.cat,seasons,colors:d.colors,loc:d.loc,note:d.note,brand:normBrand(d.brand),thumb,status:"active",hasPhoto:!!(full||d.hasPhoto)};
    let id=d.id;
    if(id){await S.db.doc("items/"+id).update(body)}
    else{body.created=Date.now();body.lastWorn=0;body.wornCount=0;body.reviews={};const ref=S.db.collection("items").doc();id=ref.id;await ref.set(body)}
    if(full){await S.db.doc("photos/"+id).set({data:full});S.photoCache[id]=full}
    S.sticky={cat:d.cat,seasons:[...d.seasons],loc:d.loc};
    if(next){toast("已保存，接着拍下一件");openForm(null)}else{closeSheet();toast("已保存")}
  }catch(e){msg.textContent="没保存成功："+(e&&e.message?e.message:"请稍后再试");
    document.querySelectorAll('[data-act="save"],[data-act="save-next"]').forEach(b=>b.disabled=false)}
}
async function loadFull(id,img){
  if(S.photoCache[id]){img.src=S.photoCache[id];return}
  try{const s=await S.db.doc("photos/"+id).get();if(s.exists){const d=s.data().data;S.photoCache[id]=d;if(img.isConnected)img.src=d}}catch(_){}
}

async function changeItemPhoto(id,file){
  const msg=$("#chg-msg");if(msg)msg.textContent="照片上传中…";
  try{
    const thumb=await toJpeg(file,260,[.72,.6]);
    const full=await toJpeg(file,900,[.75,.62,.5,.4]);
    await S.db.doc("items/"+id).update({thumb,hasPhoto:true});
    await S.db.doc("photos/"+id).set({data:full});
    S.photoCache[id]=full;
    const idx=S.items.findIndex(x=>x.id===id);if(idx>=0)S.items[idx]={...S.items[idx],thumb,hasPhoto:true};
    toast("照片已更新");
    if($("#sheet-root").innerHTML)openItem(id);
  }catch(e){const m=$("#chg-msg");if(m)m.textContent="没保存成功，请再试一次"}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-spot]");if(!t)return;
  if(t.id==="fab"){openForm(null);return}
  if(t.dataset.act==="loc-entry"){openForm(null,{loc:t.dataset.id});return}
  if(t.dataset.item&&!t.dataset.pick){openItem(t.dataset.item);return}
  if(t.dataset.item&&t.dataset.pick==="of"){const id=t.dataset.item,s=S.ofDraft.sel;s.has(id)?s.delete(id):s.add(id);reopenOutfit();return}
  if(t.closest("[data-ofeel]")&&t.dataset.v!=null){S.ofDraft.note=$("#of-note")?.value||"";S.ofDraft.feel=S.ofDraft.feel===t.dataset.v?"":t.dataset.v;reopenOutfit();return}

  if(t.dataset.item&&t.dataset.pick){const id=t.dataset.item;S.sortSel.has(id)?S.sortSel.delete(id):S.sortSel.add(id);renderKeep();return}
  if(t.dataset.loc&&!t.dataset.act){openLoc(t.dataset.loc);return}
  if(t.dataset.spot){openSpot(t.dataset.spot);return}
  if(t.dataset.rv){S.rvSeason=t.dataset.rv;renderKeep();return}
  if(t.dataset.rvset){const id=t.dataset.id,v=t.dataset.rvset;const key=reviewKey(S.rvSeason);
    const upd={["reviews."+key]:v};if(v==="drop")upd.kept=false;

  const chipBox=t.closest("[data-f],[data-fm],[data-locfill]");
  if(chipBox&&t.classList.contains("chip")){
    const v=t.dataset.v;
    if(chipBox.dataset.f){const k=chipBox.dataset.f;S[k]=S[k]===v?"":v;renderKeep();return}
    if(chipBox.dataset.fm){const k=chipBox.dataset.fm;
      if(k==="cat")draft.cat=v;else{const a=draft[k];const ix=a.indexOf(v);ix>=0?a.splice(ix,1):a.push(v)}

  }

  else if(a==="del"){const id=t.dataset.id;try{await S.db.doc("items/"+id).delete();try{await S.db.doc("photos/"+id).delete()}catch(_){}closeSheet();toast("已删除")}catch(_){toast("没删除成功")}}
  else if(a==="sel-all"){activeItems().filter(i=>!i.loc||!locById(i.loc)).forEach(i=>S.sortSel.add(i.id));renderKeep()}
  else if(a==="sel-none"){S.sortSel.clear();renderKeep()}
  else if(a==="do-sort"){const ids=[...S.sortSel],to=S.sortTarget;t.disabled=true;let ok=0;
    for(const id of ids){try{await S.db.doc("items/"+id).update({loc:to});ok++}catch(_){}}
    S.sortSel.clear();toast(`已放进 ${locName(to)}：${ok} 件`);render()}
  else if(a==="rv-skip"){const i=S.items.find(x=>x.id===t.dataset.id);S.items=S.items.filter(x=>x!==i).concat([i]);renderKeep()}
  else if(a==="new-loc")openNewLoc(t.dataset.spotPre||"");
  else if(a==="loc-save"){
    // modes 不写：这个位置在杂物间里记的清单、存货方式原样留着

  else if(a==="ldel-ask"){const id=t.dataset.id;const n=activeItems().filter(i=>i.loc===id).length;
    $("#ldel-zone").innerHTML=`<span class="sub">确定删除吗？${n?`里面的 ${n} 件会回到「待整理」。`:""}${modesOf(locById(id)).length>1?"这里在杂物间记的清单和存货不受影响。":""}</span><button class="btn danger" type="button" data-act="ldel" data-id="${esc(id)}">确定删除</button><button class="btn" type="button" data-act="close">取消</button>`}
  else if(a==="ldel"){const id=t.dataset.id;t.disabled=true;try{for(const i of activeItems().filter(i=>i.loc===id)){await S.db.doc("items/"+i.id).update({loc:""})}
    // 杂物间还在用这个位置的话，只把衣服这部分拿掉，位置本身和那边记的东西都留着
    const rest=modesOf(locById(id)).filter(m=>m!=="item");
    if(rest.length)await S.db.doc("locations/"+id).update({modes:rest,kind:"",out:false,fill:""});else await S.db.doc("locations/"+id).delete();
    closeSheet();toast("已删除")}catch(_){toast("没删除成功")}}
  else if(a==="brand-pick"){const inp=$("#fm-brand");if(inp)inp.value=t.dataset.v;t.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===t)));if(typeof checkDup==="function")checkDup()}
  else if(a==="dup-move"){const hit=S.items.find(x=>x.id===draft._dupId);const to=$("#fm-loc").value;if(!hit||!to)return;t.disabled=true;
    try{await S.db.doc("items/"+hit.id).update({loc:to});hit.loc=to;closeSheet();toast(`已把「${itemTitle(hit)}」移到 ${locName(to)}，没有新增`)}catch(_){t.disabled=false;toast("没保存成功")}}
  else if(a==="wx-geo")useMyLocation();
  else if(a==="city-go")searchCity(($("#city-q")?.value||"").trim());
  else if(a==="city-pick"){const r=(S.cityRes||[])[+t.dataset.k];if(r)setWxPlace({name:r.name,lat:+r.latitude.toFixed(2),lon:+r.longitude.toFixed(2)});renderKeep()}
  else if(a==="wx-change"){try{localStorage.removeItem("wxPlace")}catch(_){}S.wx=null;renderKeep()}
  else if(a==="wx-retry")loadWeather(true);
  else if(a==="of-new"){S.ofDraft=null;openOutfit("")}
  else if(a==="of-open"){if(!S.ro){S.ofDraft=null;openOutfit(t.dataset.id)}}
  else if(a==="of-save")saveOutfit();
  else if(a==="of-del-ask"){$("#ofdel-zone").innerHTML=`<button class="btn danger" type="button" data-act="of-del">确定删除</button>`}
  else if(a==="of-del"){try{await S.db.doc("outfits/"+S.ofDraft.id).delete();S.ofDraft=null;closeSheet();toast("已删除")}catch(_){toast("没删除成功")}}
  else if(a==="go-review"){S.tab="review";render();window.scrollTo(0,0)}
  else if(a==="go-sort"){S.tab="sort";render();window.scrollTo(0,0)}
  else if(a==="sim-pick"){draft._simPick=t.dataset.id;draft._dupOk=false;$("#sim-zone").innerHTML="";checkDup(true)}
  else if(a==="sim-ignore"){draft._simOk=true;$("#sim-zone").innerHTML=`<div class="sub">好的，当作新的一件。</div>`}
  else if(a==="dup-open"){const id=draft._dupId;if(id)openItem(id)}
  else if(a==="dup-ignore"){draft._dupOk=true;$("#dup-zone").innerHTML=`<div class="sub">好的，保存时会新增一件。</div>`}
  else if(a==="spot-edit"){const sp=t.dataset.sp;S.spotEdit=S.spotEdit===sp?null:sp;reopenSpot(sp)}
  else if(a==="lorder"){
    // 只在这个地方的几个位置之间换 order；原来的 order 值重新分给新顺序，别处的位置不受影响
    const l=locById(t.dataset.id);if(!l)return;const ls=spotLocs(l.spot),i=ls.indexOf(l),j=i+Number(t.dataset.d);if(j<0||j>=ls.length)return;
    const vals=ls.map(x=>x.order??0).sort((a,b)=>a-b);if(new Set(vals).size<vals.length)vals.forEach((_,k)=>vals[k]=vals[0]+k);
    const next=[...ls];[next[i],next[j]]=[next[j],next[i]];
    const b=S.db.batch();let n=0;next.forEach((x,k)=>{if(x.order!==vals[k]){b.update(S.db.doc("locations/"+x.id),{order:vals[k]});n++}});
    try{if(n)await b.commit();reopenSpot(l.spot)}catch(_){toast("没保存成功")}}
  else if(a==="lsel-toggle"){const id=t.dataset.id;S.locSel.clear();S.locSelFor=S.locSelFor===id?null:id;reopenLoc(id)}
  else if(a==="lsel-all"){const id=t.dataset.id,its=activeItems().filter(i=>i.loc===id);if(S.locSel.size===its.length)S.locSel.clear();else its.forEach(i=>S.locSel.add(i.id));reopenLoc(id)}
  else if(a==="lmove"){const id=t.dataset.id,v=$("#lmove-to").value;if(!v){toast("先选要移到哪里");return}const to=v==="_none"?"":v;
    const ids=[...S.locSel];t.disabled=true;let ok=0;
    for(const x of ids){try{await S.db.doc("items/"+x).update({loc:to});const it=S.items.find(i=>i.id===x);if(it)it.loc=to;ok++}catch(_){}}

  else if(a==="merge-ask"){const k=t.dataset.k;$("#merge-"+k).innerHTML=`<span class="sub">合并后其他几条会删掉，确定吗？</span><button class="btn danger" type="button" data-act="merge" data-ids="${esc(t.dataset.ids)}">确定合并</button><button class="btn" type="button" data-act="merge-cancel">取消</button>`}
  else if(a==="merge-cancel")renderKeep();
  else if(a==="merge"){t.disabled=true;try{const n=await mergeItems(t.dataset.ids.split(","));toast(`已合并成一件（删掉了 ${n} 条重复）`)}catch(e){console.warn(e);toast("没合并成功，请再试一次")}renderKeep()}
  else if(a==="save-labels")saveLabels();
  else if(a==="logout"){firebase.auth().signOut()}
});

// 合并重复：留最新录入的一条，别的信息并进来，然后删掉其他条（连同照片）
async function mergeItems(ids){
  const its=ids.map(id=>S.items.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>(b.created||0)-(a.created||0));
  if(its.length<2)return 0;
  const keep=its[0],rest=its.slice(1);
  const upd={wornCount:its.reduce((n,i)=>n+(i.wornCount||0),0),lastWorn:Math.max(0,...its.map(i=>i.lastWorn||0)),
    seasons:[...new Set(its.flatMap(i=>i.seasons||[]))],colors:[...new Set(its.flatMap(i=>i.colors||[]))],
    brand:normBrand(keep.brand||(rest.find(i=>i.brand)||{}).brand||""),reviews:Object.assign({},...rest.map(i=>i.reviews||{}),keep.reviews||{})};
  if(its.some(i=>i.kept))upd.kept=true;
  if(!keep.loc||!locById(keep.loc)){const w=its.find(i=>i.loc&&locById(i.loc));if(w)upd.loc=w.loc}
  if(!keep.thumb){const p=rest.find(i=>i.thumb);if(p){upd.thumb=p.thumb;
    if(p.hasPhoto){const ph=await S.db.doc("photos/"+p.id).get();if(ph.exists){await S.db.doc("photos/"+keep.id).set(ph.data());upd.hasPhoto=true}}}}
  await S.db.doc("items/"+keep.id).update(upd);
  for(const i of rest){await S.db.doc("items/"+i.id).delete();try{await S.db.doc("photos/"+i.id).delete()}catch(_){}}
  return rest.length}
async function saveLabels(){
  const lb=S.locs.filter(l=>l.code&&!l.out);const cols=3,W=300,H=300,pad=16;
  const rows=Math.ceil(lb.length/cols);const c=document.createElement("canvas");c.width=cols*W+pad*2;c.height=rows*H+pad*2;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
  lb.forEach((l,k)=>{const x=pad+(k%cols)*W,y=pad+Math.floor(k/cols)*H;g.strokeStyle="#1c2233";g.lineWidth=3;g.strokeRect(x+8,y+8,W-16,H-16);
    g.fillStyle="#1c2233";g.textAlign="center";g.font="600 56px 'IBM Plex Mono', monospace";g.fillText(l.code,x+W/2,y+80);
    g.font="22px sans-serif";g.fillText(l.name,x+W/2,y+118);
    const q=document.querySelector(`[data-qr="${l.id}"] canvas`);if(q)g.drawImage(q,x+W/2-70,y+136,140,140)});
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="衣帽间-标签.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)
}

/* ---------- boot ---------- */
try{const t=localStorage.getItem("tab303");if(t&&TABS.some(x=>x[0]===t))S.tab=t}catch(_){}
renderTabs();
let unsubs=[];
async function seedIfEmpty(db){
  try{const snap=await db.collection("locations").limit(1).get();if(!snap.empty)return;
    const res=await fetch("seed-locations.json",{cache:"no-store"});if(!res.ok)return;const list=await res.json();
    for(let i=0;i<list.length;i+=400){const batch=db.batch();list.slice(i,i+400).forEach(({id,...d})=>batch.set(db.collection("locations").doc(id),d));await batch.commit()}
  }catch(e){console.warn("seed",e)}
}
function start(){
  if(!window.firebase||!window.FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){$("#app").innerHTML=`<div class="stack"><div class="notice">还没有填 Firebase 配置。</div></div>`;return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  firebase.auth().onAuthStateChanged(async user=>{
    unsubs.forEach(u=>u());unsubs=[];S.user=user;S.authReady=true;S.db=null;S.loaded={i:false,l:false};
    if(!user){render();return}
    const editors=(window.EDITOR_EMAILS||[window.OWNER_EMAIL]).map(x=>String(x||"").toLowerCase());
    S.ro=!editors.includes((user.email||"").toLowerCase());
    S.db=db;render();
    if(!S.ro)await seedIfEmpty(db);
    const err=e=>{console.warn(e);toast(e&&e.code==="permission-denied"?"这个账号没有权限查看":"连接中断，刷新页面试试")};
    unsubs.push(db.collection("items").onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.i=true;render()},err));
    unsubs.push(db.collection("outfits").where("by","==",(user.email||"").toLowerCase()).onSnapshot(s=>{S.outfits=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="today")renderKeep()},e=>console.warn(e)));
    unsubs.push(db.collection("locations").orderBy("order").onSnapshot(s=>{S.locs=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.l=true;render();
      const h=location.hash.slice(1);if(h&&locById(h)&&!S.hashDone){S.hashDone=true;S.tab="map";render();openLoc(h)}},err));
  });
}
start();
